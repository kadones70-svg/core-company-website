<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>Netlify Forms Detection Helper</title>
</head>
<body>
  <!-- Netlify Build Bot Static Form Scanner Helper -->
  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" action="/success">
    <input type="hidden" name="form-name" value="contact" />
    <input type="text" name="bot-field" />
    <input type="text" name="name" />
    <input type="email" name="email" />
    <input type="text" name="solution" />
    <input type="text" name="role" />
    <input type="text" name="pain_point" />
    <textarea name="infra"></textarea>
  </form>

  <form name="download" method="POST" data-netlify="true" action="/success">
    <input type="hidden" name="form-name" value="download" />
    <input type="email" name="email" />
    <input type="text" name="document_title" />
  </form>
</body>
</html>
